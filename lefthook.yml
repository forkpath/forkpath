# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

# --no-errors-on-unmatched: 在没有匹配文件时，静默即可，不输出错误
pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,md,mdx}"
      run: npx @biomejs/biome check --no-errors-on-unmatched --colors=off {staged_files}
      stage_fixed: true

commit-msg:
  scripts:
    lint-commit-msg:
      runner: node
      command: npx commitlint --edit $1

# 不需要在CI或本地检查devDependencies
pre-push:
  parallel: true
  commands:
    packages-audit:
      run: npm audit --omit=dev
